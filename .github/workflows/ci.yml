name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ClarioShop.slnx

      - name: Build (warnings are errors)
        run: dotnet build ClarioShop.slnx --configuration Release --no-restore

      - name: Check formatting
        run: dotnet format ClarioShop.slnx --verify-no-changes --no-restore --exclude "**/Migrations/**"

      - name: Test (integration tests use Testcontainers PostgreSQL)
        run: dotnet test --solution ClarioShop.slnx --configuration Release --no-build
